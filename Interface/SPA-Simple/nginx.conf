pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    server {
      root spa/;

      listen 7781;
      access_log logs/access.log;
      error_log logs/error.log;

      location /static/ {
        alias spa/static/;
      }

      location /api-truco/ {
        proxy_pass http://localhost:7777/;
      }

      location / {
        try_files '' /index.html =404;
      }
    }
}
